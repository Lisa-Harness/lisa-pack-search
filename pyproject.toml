[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_packs*", "lisa_packs.search*"]

[tool.setuptools.package-data]
"lisa_packs.search" = ["content/**/*.md", "content/**/*.yml", "content/**/*.yaml", "content/**/*.txt", "modes/**/*.md", "operations/**/*.md", "operations/**/*.yml", "tools/**/*.yml"]

[project]
name = "lisa-pack-search"
version = "0.1.0"
description = "Lisa search and reasoning pack - discuss/search/ponder modes, research operations, and a generic web_search provider stub"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lisa_packs/search/tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
search = "lisa_packs.search:get_content_root"